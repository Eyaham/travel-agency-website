# config/packages/security.yaml

security:
    password_hashers:
        # Hashage automatique pour les utilisateurs
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        # Provider basé sur l'entité User
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Formulaire de login
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                enable_csrf: true
                always_use_default_target_path: false

            logout:
                path: app_logout
                target: /

            # Point d’entrée si non connecté
            entry_point: form_login

    access_control:
        # Accès public pour login et register
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        # Tous les autres chemins nécessitent ROLE_USER
        - { path: ^/, roles: ROLE_USER }

# Configuration spécifique pour l'environnement "test"
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
